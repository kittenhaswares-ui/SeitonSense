name: Verify release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SeitonSense.slnx --locked-mode
      - name: Verify committed package
        shell: pwsh
        run: |
          ./scripts/Verify-SafetyContract.ps1
          ./scripts/Verify-Release.ps1
      - name: Test dependency-free core
        run: >-
          dotnet run
          --project tests/SeitonSense.Core.SelfTest/SeitonSense.Core.SelfTest.csproj
          --configuration Release
          --no-restore
