name: Verify release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SeitonSense.slnx --locked-mode
      # The Dalamud plugin project references assemblies shipped by a local
      # XIVLauncher installation. The release script performs that full build
      # before packaging; hosted CI can reproducibly compile the dependency-free
      # policy core and verify the committed, source-fingerprinted plugin ZIP.
      # Build-Release.ps1 additionally runs the plugin integration tests on
      # the release machine where Dalamud's local runtime assemblies exist.
      - name: Build dependency-free core
        run: >-
          dotnet build
          src/SeitonSense.Core/SeitonSense.Core.csproj
          --configuration Release
          --no-restore
      - name: Verify committed package
        shell: pwsh
        run: |
          ./scripts/Verify-SafetyContract.ps1
          ./scripts/Verify-Release.ps1
      - name: Test dependency-free core
        run: >-
          dotnet run
          --project tests/SeitonSense.Core.SelfTest/SeitonSense.Core.SelfTest.csproj
          --configuration Release
          --no-restore
